name: Build and Deploy

# Trigger: run this pipeline on every push to main branch
on:
  push:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest   # GitHub provides this machine for free
    
    steps:
      # Step 1: Get the code onto the GitHub machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: Run your tests
      - name: Run tests
        run: pytest tests/ -v

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test   # Only deploy if tests pass
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Trigger a Render deployment via their API
      # The deploy hook URL is stored as a GitHub Secret (never hardcoded)
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
